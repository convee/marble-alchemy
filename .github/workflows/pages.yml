name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # 对比首页 + 两个版本各自的构建产物，分别落在 /gpt6/ 与 /fable5.1/ 子路径
      - name: Build gpt6
        working-directory: gpt6
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
        run: |
          npm ci
          npm run build -- --base=./
      - name: Build fable5.1
        working-directory: fable5.1
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r site/. dist/
          cp -r gpt6/dist dist/gpt6
          cp -r fable5.1/dist dist/fable5.1
          test -f dist/index.html
          test -f dist/gpt6/index.html
          test -f dist/fable5.1/index.html

      - name: Validate game registry
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const registry = JSON.parse(fs.readFileSync('dist/games.json', 'utf8'));
          if (!Array.isArray(registry.games) || registry.games.length === 0) throw new Error('games.json must contain games');
          const slugs = new Set();
          for (const game of registry.games) {
            if (!game.slug || slugs.has(game.slug)) throw new Error(`duplicate game slug: ${game.slug}`);
            slugs.add(game.slug);
            if (!Array.isArray(game.variants) || game.variants.length === 0) throw new Error(`game has no variants: ${game.slug}`);
            const variantSlugs = new Set();
            for (const variant of game.variants) {
              if (!variant.slug || variantSlugs.has(variant.slug)) throw new Error(`duplicate variant slug: ${game.slug}/${variant.slug}`);
              variantSlugs.add(variant.slug);
              if (!variant.playPath?.startsWith('/') || !variant.playPath.endsWith('/')) throw new Error(`invalid playPath: ${variant.playPath}`);
              if (!/^https:\/\//.test(variant.sourcePath || '')) throw new Error(`invalid sourcePath: ${variant.sourcePath}`);
              if (!fs.existsSync(path.join('dist', variant.playPath, 'index.html'))) throw new Error(`missing build output: ${variant.playPath}`);
              if (variant.image && !fs.existsSync(path.join('dist', variant.image))) throw new Error(`missing cover image: ${variant.image}`);
            }
          }
          NODE

      - name: Write public monetization config
        env:
          STRIPE_PAYMENT_LINK: ${{ vars.STRIPE_PAYMENT_LINK }}
          PADDLE_PAYMENT_LINK: ${{ vars.PADDLE_PAYMENT_LINK }}
          PADDLE_CLIENT_TOKEN: ${{ vars.PADDLE_CLIENT_TOKEN }}
          PADDLE_PRICE_ID: ${{ vars.PADDLE_PRICE_ID }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const values = {
            stripePaymentLink: String(process.env.STRIPE_PAYMENT_LINK || '').trim(),
            paddlePaymentLink: String(process.env.PADDLE_PAYMENT_LINK || '').trim(),
            paddleClientToken: String(process.env.PADDLE_CLIENT_TOKEN || '').trim(),
            paddlePriceId: String(process.env.PADDLE_PRICE_ID || '').trim(),
            adsenseClient: String(process.env.ADSENSE_CLIENT || '').trim(),
            adsenseSlot: String(process.env.ADSENSE_SLOT || '').trim(),
          };
          fs.writeFileSync('dist/monetization-config.js', `window.CHAOSCHEMY_MONETIZATION = ${JSON.stringify(values)};\n`);
          fs.rmSync('dist/ads.txt', { force: true });
          if (values.adsenseClient.startsWith('ca-pub-')) {
            const publisher = values.adsenseClient.replace(/^ca-/, '');
            fs.writeFileSync('dist/ads.txt', `google.com, ${publisher}, DIRECT, f08c47fec0942fa0\n`);
          }
          NODE

      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
