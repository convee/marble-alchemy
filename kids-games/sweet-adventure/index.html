<script>
'use strict';
/* ================= 基础 ================= */
/* 老内核(iOS<16/旧微信X5)没有 ctx.roundRect，补上，否则渲染中途抛错白屏 */
if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(typeof r === 'number' ? r : 8, Math.abs(w) / 2, Math.abs(h) / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}
/* 手机上出错时把错误显示出来，方便远程排查 */
window.addEventListener('error', function (ev) {
  try {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#c0392b;color:#fff;font-size:12px;padding:8px 10px;border-radius:8px;opacity:.93;word-break:break-all;';
    d.textContent = '⚠️ 出错了: ' + (ev.message || '未知错误') + ' @' + (ev.lineno || '?');
    document.body.appendChild(d);
    setTimeout(function () { d.remove(); }, 10000);
  } catch (e) {}
});
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  /* 显式设 CSS 尺寸：不依赖 inset/100vh，任何内核下画布都恰好铺满可视区 */
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 300); });
resize();
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

/* ================= 音频（WebAudio 合成，零素材） ================= */
let AC = null, master = null, bgmGain = null, muted = false, bgmTimer = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
    bgmGain = AC.createGain(); bgmGain.gain.value = 0.055; bgmGain.connect(master);
  } catch (e) { /* 无音频也能玩 */ }
}
function tone(freq, dur, type, gain, delay, dest) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(dest || master);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  click() { tone(880, 0.07, 'sine', 0.12); },
  jump() { tone(420, 0.12, 'sine', 0.13); tone(640, 0.1, 'sine', 0.08, 0.05); },
  jump2() { tone(560, 0.1, 'sine', 0.13); tone(840, 0.12, 'sine', 0.1, 0.04); },
  catch() { tone(760, 0.1, 'sine', 0.15); tone(1140, 0.12, 'sine', 0.08, 0.04); },
  star() { [880, 1108, 1318, 1760].forEach((f, i) => tone(f, 0.12, 'triangle', 0.13, i * 0.05)); },
  book() { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.14, 'triangle', 0.14, i * 0.06)); },
  hurt() { tone(200, 0.25, 'sawtooth', 0.12); tone(150, 0.3, 'square', 0.06, 0.05); },
  levelup() { [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => tone(f, 0.18, 'triangle', 0.15, i * 0.09)); },
  over() { [660, 550, 440, 330].forEach((f, i) => tone(f, 0.3, 'triangle', 0.13, i * 0.18)); },
  magnet() { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 0.1, 'sine', 0.12, i * 0.04)); },
  shieldGet() { tone(400, 0.1, 'triangle', 0.12); tone(700, 0.16, 'sine', 0.12, 0.05); tone(1000, 0.18, 'sine', 0.1, 0.1); },
  block() { tone(520, 0.1, 'square', 0.13); tone(320, 0.16, 'square', 0.08, 0.04); tone(880, 0.14, 'triangle', 0.1, 0.06); },
  land() { tone(240, 0.08, 'sine', 0.08); }
};
/* 轻快 BGM：小星星 */
const MELODY = [523, 523, 784, 784, 880, 880, 784, 0, 698, 698, 659, 659, 587, 587, 523, 0];
let bgmStep = 0;
function startBgm() {
  if (!AC || bgmTimer) return;
  bgmTimer = setInterval(() => {
    if (game.screen !== 'play' || game.paused) return;
    const f = MELODY[bgmStep % MELODY.length]; bgmStep++;
    if (f) { tone(f, 0.26, 'triangle', 1, 0, bgmGain); tone(f / 2, 0.3, 'sine', 0.5, 0, bgmGain); }
  }, 300);
}
function toggleMute() {
  muted = !muted;
  if (master) master.gain.value = muted ? 0 : 1;
  $('btnMute').textContent = muted ? '🔇' : '🔊';
}

/* ================= 角色（Canvas 手绘萌系） ================= */
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function face(c, x, y, s, t, blush, mouth) {
  const blink = (Math.sin(t * 1.7) > 0.985);
  c.fillStyle = '#3a3a3a';
  if (blink) {
    c.lineWidth = 2 * s; c.strokeStyle = '#3a3a3a';
    c.beginPath(); c.moveTo(x - 13 * s, y); c.lineTo(x - 7 * s, y); c.moveTo(x + 7 * s, y); c.lineTo(x + 13 * s, y); c.stroke();
  } else {
    c.beginPath(); c.ellipse(x - 10 * s, y, 3.2 * s, 4.6 * s, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(x + 10 * s, y, 3.2 * s, 4.6 * s, 0, 0, 7); c.fill();
    c.fillStyle = '#fff';
    c.beginPath(); c.arc(x - 9 * s, y - 1.6 * s, 1.1 * s, 0, 7); c.fill();
    c.beginPath(); c.arc(x + 11 * s, y - 1.6 * s, 1.1 * s, 0, 7); c.fill();
  }
  c.fillStyle = blush || '#ffb3c8';
  c.globalAlpha = 0.75;
  c.beginPath(); c.ellipse(x - 16 * s, y + 6 * s, 4 * s, 2.6 * s, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(x + 16 * s, y + 6 * s, 4 * s, 2.6 * s, 0, 0, 7); c.fill();
  c.globalAlpha = 1;
  c.strokeStyle = '#c96'; c.lineWidth = 1.6 * s; c.lineCap = 'round';
  c.beginPath();
  if (mouth === 'w') { c.arc(x - 2.5 * s, y + 7 * s, 2.5 * s, 0.15, Math.PI - 0.15); c.arc(x + 2.5 * s, y + 7 * s, 2.5 * s, 0.15, Math.PI - 0.15); }
  else { c.arc(x, y + 6 * s, 3.5 * s, 0.25, Math.PI - 0.25); }
  c.stroke();
}
/* 每个角色：draw(c,x,y,s,t)  x,y=头中心 s=缩放 t=时间 */
const CHARS = [
  { id: 'melody', name: '小美美', color: '#ff86b8', tag: '粉粉兔',
    draw(c, x, y, s, t) {
      const bob = Math.sin(t * 3) * 2 * s;  y += bob;
      c.fillStyle = '#ffb0d0';
      c.beginPath(); c.ellipse(x - 16 * s, y - 30 * s, 9 * s, 22 * s, -0.35, 0, 7); c.fill();
      c.beginPath(); c.ellipse(x + 16 * s, y - 30 * s, 9 * s, 22 * s, 0.35, 0, 7); c.fill();
      c.fillStyle = '#ffc2da';
      c.beginPath(); c.arc(x, y, 26 * s, 0, 7); c.fill();
      c.fillStyle = '#fffdf8';
      c.beginPath(); c.ellipse(x, y + 4 * s, 19 * s, 16 * s, 0, 0, 7); c.fill();
      c.fillStyle = '#ff5f8f';
      for (let i = 0; i < 5; i++) {
        c.beginPath(); c.arc(x - 19 * s + Math.cos(i / 5 * 6.28) * 3.4 * s, y - 16 * s + Math.sin(i / 5 * 6.28) * 3.4 * s, 2.6 * s, 0, 7); c.fill(); }
      c.fillStyle = '#ffe066'; c.beginPath(); c.arc(x - 19 * s, y - 16 * s, 2.2 * s, 0, 7); c.fill();
      face(c, x, y + 3 * s, s, t);
    } },
  { id: 'kuromi', name: '酷洛洛', color: '#9d6fe0', tag: '紫紫兔',
    draw(c, x, y, s, t) {
      const bob = Math.sin(t * 3 + 1) * 2 * s; y += bob;
      c.fillStyle = '#4a4257';
      c.beginPath(); c.ellipse(x - 17 * s, y - 28 * s, 10 * s, 22 * s, -0.5, 0, 7); c.fill();
      c.beginPath(); c.ellipse(x + 17 * s, y - 28 * s, 10 * s, 22 * s, 0.5, 0, 7); c.fill();
      c.fillStyle = '#ffb3d9';
      c.beginPath(); c.ellipse(x - 17 * s, y - 27 * s, 4.5 * s, 13 * s, -0.5, 0, 7); c.fill();
      c.beginPath(); c.ellipse(x + 17 * s, y - 27 * s, 4.5 * s, 13 * s, 0.5, 0, 7); c.fill();
      c.fillStyle = '#544b63';
      c.beginPath(); c.arc(x, y, 26 * s, 0, 7); c.fill();

/* ================= 关卡生成 ================= */
/* 实体都在“世界秒”坐标：wt = 到达玩家所需秒数×速度 → 像素 */
function genLevel(lv, speed) {
  const dur = 32 + lv * 5;                 // 关卡时长(秒)
  const ents = [];                         // {x, type, h(离地高), r, owner, kind, taken:[]}
  let t = 3.2;
  const minGap = Math.max(0.85, 1.5 - lv * 0.08);
  while (t < dur - 3) {
    const roll = Math.random();
    if (roll < 0.33) {                                     // 障碍
      const n = lv >= 3 && Math.random() < 0.35 ? 2 : 1;
      for (let i = 0; i < n; i++)
        ents.push({ x: (t + i * 0.42) * speed, type: 'ob', kind: Math.floor(rnd(0, 3)), hit: [false, false] });
      t += 0.42 * (n - 1);
    } else if (roll < 0.72) {                              // 一排/一拱甜点
      const n = 3 + Math.floor(rnd(0, 3));
      const arc = Math.random() < 0.5;
      const baseH = arc ? 40 : rnd(35, 70);
      const owner = -1;
      const types = ['straw', 'straw', 'candy', 'cake'];
      for (let i = 0; i < n; i++) {
        const h = arc ? baseH + Math.sin(i / (n - 1) * Math.PI) * 85 : baseH;
        ents.push({ x: (t + i * 0.28) * speed, type: types[Math.floor(rnd(0, types.length))],
          h, r: 15, owner, wob: rnd(0, 6), taken: [false, false], pts: 10 });
      }
      t += 0.28 * n;
    } else if (roll < 0.85) {                              // 高处星星(要二段跳)
      ents.push({ x: t * speed, type: 'star', h: rnd(130, 165), r: 16, owner: -1, wob: rnd(0, 6), taken: [false, false], pts: 30 });
    } else if (roll < 0.93) {                              // 米小圈漫画书(稀有)
      ents.push({ x: t * speed, type: 'book', h: rnd(60, 110), r: 18, owner: -1, wob: rnd(0, 6), taken: [false, false], pts: 50 });
    } else {                                               // 道具：彩虹磁铁 / 盾牌(稀有奖励)
      const kind = Math.random() < 0.5 ? 'magnet' : 'shield';
      ents.push({ x: t * speed, type: kind, h: rnd(55, 95), r: 17, owner: -1, wob: rnd(0, 6), taken: [false, false], pts: 0 });
    }
    t += minGap * rnd(0.9, 1.5);
  }
  /* 甜点分值微调 */
  for (const e of ents) { if (e.type === 'candy') e.pts = 15; if (e.type === 'cake') e.pts = 20; }
  return { ents, len: dur * speed, dur };
}

  const p = game.players[pi];
  if (!p) return;
  if (p.jumps === 0) { p.vy = jumpV(pi); p.jumps = 1; sfx.jump(); }
  else if (p.jumps === 1) { p.vy = jumpV(pi) * 0.95; p.jumps = 2; sfx.jump2(); spawnParts(playerSX(pi), playerSY(pi) + 20, '#fff', 6); }
}
function jumpV(pi) { const lane = laneRect(pi); return 620 * laneScale(lane); }
function gravity(pi) { const lane = laneRect(pi); return 1950 * laneScale(lane); }
function playerSX(pi) { return W * 0.24; }
function playerSY(pi) {
  const lane = laneRect(pi);
  return laneGround(lane) - game.players[pi].py - 30 * laneScale(lane);
}

window.addEventListener('keydown', e => {
  if (['ArrowUp', 'Space', 'KeyW'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (game.screen === 'menu' || game.screen === 'over') {
    if (e.code === 'Space' || e.code === 'Enter') startGame();
    return;
  }
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) doJump(0);
  if (e.code === 'KeyP' && game.screen === 'play') togglePause();
});

cv.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  doJump(0);
}, { passive: false });
cv.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
cv.addEventListener('mousedown', e => {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  doJump(0);
});

function togglePause() {
  if (game.screen !== 'play') return;
  game.paused = !game.paused;
  $('pauseMask').classList.toggle('hidden', !game.paused);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden && game.screen === 'play' && !game.paused) togglePause();
});

/* ================= 主循环 ================= */
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = clamp((now - lastT) / 1000, 0, 0.05);
  lastT = now;
  if (game.screen === 'play' && !game.paused) update(dt);
  render(now / 1000);
}

function update(dt) {
  game.time += dt;
  const wd = game.world;
  wd.dist += curSpeed() * dt;
  $('progFill').style.width = clamp(wd.dist / wd.len * 100, 0, 100) + '%';

  /* 玩家物理 */
  for (let pi = 0; pi < game.players.length; pi++) {
    const p = game.players[pi];
    p.py += p.vy * dt;
    p.vy -= gravity(pi) * dt;
    if (p.py <= 0) {
      if (p.jumps > 0) {                     // 真落地：扬起尘土+软着陆音
        p.squash = 1;
        const lane = laneRect(pi), s = laneScale(lane);
        spawnDust(playerSX(pi), laneGround(lane), s);
        sfx.land();
      }
      p.py = 0; p.vy = 0; p.jumps = 0;
    }
    p.inv = Math.max(0, p.inv - dt);
    p.squash = Math.max(0, p.squash - dt * 5);
  }

  /* 碰撞：实体世界x - dist = 相对玩家距离 */
  const px = W * 0.24;
  for (const e of wd.ents) {
    const rel = e.x - wd.dist;
    if (rel < -100 || rel > W + 100) continue;
    for (let pi = 0; pi < game.players.length; pi++) {
      const p = game.players[pi];
      const lane = laneRect(pi), s = laneScale(lane), gy = laneGround(lane);
      const ex = px + rel;
      if (e.type === 'ob') {
        if (Math.abs(rel) > 34 * s) continue;
        if (e.hit[0] || p.inv > 0) continue;
        if (p.py < 40 * s) {                       // 没跳过去
          e.hit[0] = true;
          if (game.shield) {                       // 盾牌顶掉一次，不掉血
            game.shield = false; p.inv = 1.0; game.shake = 0.2;
            sfx.block(); spawnParts(px, gy - 30 * s, '#8ecbff', 16);
            showToast('🛡️ 盾牌帮你挡住啦！');
            updateHud();
          } else {
            p.inv = 1.5;
            game.hearts--; game.shake = 0.35; game.hurtFlash = 0.4;
            sfx.hurt(); spawnParts(px, gy - 20 * s, '#8d93a8', 10);
            updateHud();
            if (game.hearts <= 0) { endGame(); return; }
          }
        }
      } else {
        if (e.taken[0]) continue;
        const isSweet = e.type !== 'magnet' && e.type !== 'shield';
        const ey = e.h * s;                        // 离地高度
        const tx = px, ty = gy - p.py - 24 * s;    // 玩家身体屏幕坐标
        let got = false;
        if (game.magnet > 0 && isSweet && rel > -60 && rel < 320) e.pulling = true;
        if (e.pulling && isSweet) {                // 磁铁：把甜点吸向玩家
          if (e.mx === undefined) { e.mx = ex; e.my = gy - ey; }
          const k = Math.min(1, dt * 9);
          e.mx += (tx - e.mx) * k; e.my += (ty - e.my) * k;
          if (Math.abs(e.mx - tx) < 26 * s && Math.abs(e.my - ty) < 26 * s) got = true;
        } else {
          if (Math.abs(rel) > 34 * s) continue;
          if (Math.abs(p.py + 26 * s - ey) < 42 * s) got = true;
        }
        if (got) {
          e.taken[0] = true;
          const sxp = e.pulling ? e.mx : ex;
          const sy = e.pulling ? e.my : gy - ey;
          if (e.type === 'magnet') {
            game.magnet = 6.5; sfx.magnet();
            showToast('🌈 彩虹磁铁！甜点都飞过来啦～');
            spawnParts(sxp, sy, '#c9a8ff', 14);
          } else if (e.type === 'shield') {
            game.shield = true; sfx.shieldGet();
            showToast('🛡️ 得到盾牌！能挡住一次乌云哦～');
            spawnParts(sxp, sy, '#8ecbff', 14);
          } else {
            game.score += e.pts;
            if (e.type === 'star') sfx.star();
            else if (e.type === 'book') { sfx.book(); showToast('📖 米小圈：哇！你太棒啦！+50'); }
            else sfx.catch();
            spawnParts(sxp, sy, e.type === 'star' ? '#ffd94f' : '#ff9ec7', 8);
            game.floats.push({ x: sxp, y: sy - 10, txt: '+' + e.pts, t: 1, c: '#ff4f92' });
          }
          updateHud();
          window.KidsAI && window.KidsAI.setContext({
            level: game.level, score: game.score, hearts: game.hearts,
            collected: e.type, distance: Math.round(wd.dist)
          });
        }
      }
    }
  }

  /* 通关 */
  if (!game.cleared && wd.dist >= wd.len) {
    game.cleared = true;
    game.score += 100;
    game.hearts = Math.min(5, game.hearts + 1);
    sfx.levelup();
    showBanner('🎉 第' + game.level + '关通关！+100', 1600);
    showToast('💗 爱心+1！下一关跑得更快哦～');
    for (let pi = 0; pi < game.players.length; pi++)
      spawnParts(playerSX(pi), playerSY(pi), '#ffd94f', 18);
    game.level++;
    updateHud();
    window.KidsAI && window.KidsAI.event('round_complete', {
      level: game.level - 1, score: game.score, stars: 1, hearts: game.hearts
    });
    setTimeout(() => { if (game.screen === 'play') startLevel(); }, 400);
  }

  /* 粒子/浮字 */
  for (let i = game.parts.length - 1; i >= 0; i--) {
    const q = game.parts[i]; q.t -= dt * 1.8; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += 300 * dt;
    if (q.t <= 0) game.parts.splice(i, 1);
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i]; f.t -= dt * 1.1; f.y -= 45 * dt;
    if (f.t <= 0) game.floats.splice(i, 1);
  }
  game.shake = Math.max(0, game.shake - dt);
  game.hurtFlash = Math.max(0, game.hurtFlash - dt);
  game.magnet = Math.max(0, game.magnet - dt);
}
function spawnParts(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, 6.28), v = rnd(50, 190);
    game.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, t: 1, c: color, r: rnd(2, 5) });
  }
}
/* 落地扬尘：贴地向两侧的小白团 */
function spawnDust(x, y, s) {
  for (let i = 0; i < 6; i++) {
    const dir = i < 3 ? -1 : 1;
    game.parts.push({ x: x + dir * 5, y: y - 2, vx: dir * rnd(50, 120), vy: -rnd(15, 55),
      t: 0.7, c: 'rgba(255,255,255,.9)', r: rnd(2, 4) * s });
  }
}

/* ================= 渲染 ================= */
const bgClouds = [];
for (let i = 0; i < 6; i++) bgClouds.push({ x: Math.random(), y: Math.random() * 0.35 + 0.04, s: rnd(0.6, 1.3), v: rnd(0.004, 0.012) });

/* 关卡视觉主题：白天→黄昏→星夜→樱花，随关卡循环 */
const THEMES = [
  { sky: ['#bfeaff', '#ffe3f0', '#fff5d7'], grass: ['#a8e6a1', '#8fd889'], cloud: 'rgba(255,255,255,.85)',
    orb: { x: 0.86, y: 70, r: 34, c1: '#ffe9a8', c2: '#ffdb70' }, rainbow: 0.45, extra: '' },
  { sky: ['#ffcf9a', '#ffabc0', '#ffe0c4'], grass: ['#8fcf8a', '#79bd77'], cloud: 'rgba(255,232,208,.85)',
    orb: { x: 0.8, y: 118, r: 40, c1: '#ffd889', c2: '#ff9d5c' }, rainbow: 0.28, extra: '' },
  { sky: ['#3b3670', '#5a4a90', '#8f6fa6'], grass: ['#5f9e6a', '#4f8a5b'], cloud: 'rgba(220,225,255,.5)',
    orb: { x: 0.84, y: 78, r: 30, c1: '#fdfbe6', c2: '#e8e4bf', moon: true }, rainbow: 0.32, extra: 'stars' },
  { sky: ['#ffd0e6', '#ffe0ef', '#fff2f8'], grass: ['#a8e6a1', '#8fd889'], cloud: 'rgba(255,255,255,.82)',
    orb: { x: 0.86, y: 70, r: 34, c1: '#ffe9a8', c2: '#ffdb70' }, rainbow: 0.45, extra: 'petals' },
];
function curTheme() { return (game.screen === 'play' || game.screen === 'over') ? THEMES[(game.level - 1) % THEMES.length] : THEMES[0]; }

const bgStars = [];
for (let i = 0; i < 42; i++) bgStars.push({ x: Math.random(), y: Math.random() * 0.5, r: rnd(0.6, 1.9), ph: rnd(0, 6.28) });
const petalSeeds = [];
for (let i = 0; i < 16; i++) petalSeeds.push({ x0: Math.random(), y0: Math.random(), fall: rnd(28, 55), drift: rnd(0.02, 0.06), sway: rnd(1, 2.2), ph: rnd(0, 6.28), sz: rnd(5, 9) });

function drawStars(t) {
  ctx.save(); ctx.fillStyle = '#fffbe8';
  for (const st of bgStars) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.5 + st.ph));
    ctx.beginPath(); ctx.arc(st.x * W, st.y * H, st.r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function drawPetals(t) {
  ctx.save(); ctx.fillStyle = 'rgba(255,183,213,.9)';
  for (const p of petalSeeds) {
    const y = ((p.y0 + t * p.fall / H) % 1.15) * H - 0.08 * H;
    const x = (((p.x0 - t * p.drift) % 1 + 1) % 1) * W + Math.sin(t * p.sway + p.ph) * 16;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(t * p.sway + p.ph) * 0.8);
    ctx.beginPath(); ctx.ellipse(0, 0, p.sz * 0.55, p.sz, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}
function drawSky(t) {
  const th = curTheme();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(0.6, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(-30, -30, W + 60, H + 60);

  if (th.extra === 'stars') drawStars(t);

  const rainbowC = ['#ffb3ba', '#ffdfba', '#ffffba', '#baffc9', '#bae1ff', '#d9baff'];
  ctx.save(); ctx.globalAlpha = th.rainbow; ctx.lineWidth = Math.max(8, H * 0.014);
  for (let i = 0; i < rainbowC.length; i++) {
    ctx.strokeStyle = rainbowC[i];
    ctx.beginPath(); ctx.arc(W * 0.5, H * 0.95, H * 0.75 - i * ctx.lineWidth, Math.PI * 1.05, Math.PI * 1.95); ctx.stroke();
  }
  ctx.restore();

  const orb = th.orb, ox = orb.x * W, oy = orb.y;
  ctx.fillStyle = orb.c1; ctx.beginPath(); ctx.arc(ox, oy, orb.r, 0, 7); ctx.fill();
  ctx.fillStyle = orb.c2; ctx.beginPath(); ctx.arc(ox, oy, orb.r * 0.76, 0, 7); ctx.fill();
  if (orb.moon) { ctx.fillStyle = th.sky[0]; ctx.beginPath(); ctx.arc(ox + orb.r * 0.42, oy - orb.r * 0.28, orb.r * 0.82, 0, 7); ctx.fill(); }

  for (const c of bgClouds) {
    c.x -= c.v / 20;                       // 云向后飘,有跑动感
    if (c.x < -0.15) c.x = 1.15;
    const cx = c.x * W, cy = c.y * H, s = c.s * Math.min(W, H) / 12;
    ctx.fillStyle = th.cloud;
    ctx.beginPath();
    ctx.arc(cx - s, cy, s * 0.8, 0, 7); ctx.arc(cx, cy - s * 0.45, s, 0, 7); ctx.arc(cx + s, cy, s * 0.8, 0, 7);
    ctx.arc(cx, cy + s * 0.25, s * 0.9, 0, 7); ctx.fill();
  }
  if (th.extra === 'petals') drawPetals(t);
}
function drawLaneGround(lane, dist) {
  const gy = laneGround(lane);
  const grass = curTheme().grass;
  ctx.fillStyle = grass[0];
  ctx.beginPath(); ctx.moveTo(0, gy + 14);
  const off = -(dist % 40);
  for (let x = off - 40; x <= W + 40; x += 40) ctx.quadraticCurveTo(x + 20, gy + 2, x + 40, gy + 14);
  ctx.lineTo(W + 40, lane.y + lane.h); ctx.lineTo(-40, lane.y + lane.h); ctx.closePath(); ctx.fill();
  ctx.fillStyle = grass[1];
  ctx.fillRect(0, Math.min(gy + 26, lane.y + lane.h - 6), W, lane.y + lane.h - gy);
  /* 随地面滚动的小花 */
  for (let i = 0; i < 9; i++) {
    const wx = i * 220 + 60;
    const fx = ((wx - dist * 0.9) % (220 * 9) + 220 * 9) % (220 * 9) - 110;
    if (fx < -20 || fx > W + 20) continue;
    const fy = gy + Math.max(lane.h * 0.055, 20);
    ctx.fillStyle = ['#ff9ec7', '#fff', '#ffd94f'][i % 3];
    for (let j = 0; j < 5; j++) { ctx.beginPath();
      ctx.arc(fx + Math.cos(j / 5 * 6.28) * 4, fy + Math.sin(j / 5 * 6.28) * 4, 3, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#ffb52e'; ctx.beginPath(); ctx.arc(fx, fy, 2.5, 0, 7); ctx.fill();
  }
}
function render(t) {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (game.shake > 0) ctx.translate(rnd(-6, 6) * game.shake, rnd(-6, 6) * game.shake);
  drawSky(t);

  if (game.screen === 'play' || game.screen === 'over') {
    const wd = game.world;
    for (let pi = 0; pi < game.players.length; pi++) {
      const p = game.players[pi];
      const lane = laneRect(pi), s = laneScale(lane), gy = laneGround(lane);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, lane.y, W, lane.h); ctx.clip();
      drawLaneGround(lane, wd.dist);
      const px = playerSX(pi);
      /* 终点门(快到时出现) */
      const goalRel = wd.len - wd.dist + 120;
      if (goalRel < W + 200) drawGoal(ctx, px + goalRel, gy, s, t);
      /* 实体 */
      for (const e of wd.ents) {
        const rel = e.x - wd.dist;
        if (rel < -80 || rel > W + 80) continue;
        const ex = px + rel;
        if (e.type === 'ob') { e.sx = ex; e.sy = gy; drawObstacle(ctx, e, t, s); }
        else {
          if (e.taken[0]) continue;
          if (e.pulling && e.mx !== undefined) { e.sx = e.mx; e.sy = e.my; }   // 被磁铁吸着飞
          else { e.sx = ex; e.sy = gy - e.h * s + Math.sin(t * 2.5 + e.wob) * 4 * s; }
          drawItem(ctx, e, t, s);
        }
      }
      /* 角色 */
      const py = gy - p.py - 24 * s;
      const blinkInv = p.inv > 0 && Math.floor(t * 12) % 2 === 0;
      if (!blinkInv) {
        const sq = 1 + p.squash * 0.15;
        ctx.save(); ctx.translate(px, py); ctx.scale(sq, 1 / sq); ctx.rotate(p.jumps ? -0.08 : 0); ctx.translate(-px, -py);
        drawRunnerBody(ctx, px, py, s, t, p.char.color, p.jumps > 0);
        p.char.draw(ctx, px, py - 31 * s, s, t + pi * 2);
        ctx.restore();
      }
      /* 道具光环（受伤闪烁时也保留，方便小朋友看清状态） */
      const bcx = px, bcy = gy - p.py - 30 * s;
      if (game.shield) {
        ctx.save();
        ctx.globalAlpha = 0.22 + Math.sin(t * 6) * 0.06;
        ctx.fillStyle = '#bfe6ff';
        ctx.beginPath(); ctx.arc(bcx, bcy, 42 * s, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.85; ctx.lineWidth = 2.5 * s; ctx.strokeStyle = '#8ecbff';
        ctx.beginPath(); ctx.arc(bcx, bcy, 42 * s, 0, 7); ctx.stroke();
        ctx.restore();
      }
      if (game.magnet > 0) {
        const frac = clamp(game.magnet / 6.5, 0, 1);
        ctx.save();
        ctx.globalAlpha = 0.55; ctx.lineWidth = 3 * s;
        const rc = ['#ff9eb5', '#ffd59e', '#fff3a8', '#b8f0c0', '#a8dcff', '#d9c2ff'];
        for (let i = 0; i < rc.length; i++) {
          ctx.strokeStyle = rc[i];
          ctx.beginPath(); ctx.arc(bcx, bcy, (40 + i * 2.2) * s, 0, 7); ctx.stroke();
        }
        ctx.globalAlpha = 0.95; ctx.lineWidth = 4 * s; ctx.strokeStyle = '#a06bff';   // 剩余时间环
        ctx.beginPath(); ctx.arc(bcx, bcy, 54 * s, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2); ctx.stroke();
        ctx.globalAlpha = 1; ctx.font = `${18 * s}px sans-serif`; ctx.textAlign = 'center';
        ctx.fillText('🧲', bcx, bcy - 60 * s);
        ctx.restore();
      }
      ctx.restore();
    }
    /* 粒子 */
    for (const q of game.parts) {
      ctx.globalAlpha = Math.max(0, q.t);
      ctx.fillStyle = q.c;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of game.floats) {
      ctx.globalAlpha = Math.max(0, f.t);
      ctx.fillStyle = f.c; ctx.font = `bold ${Math.max(18, W * 0.03)}px sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(f.txt, f.x, f.y);
    }
    ctx.globalAlpha = 1;
    if (game.hurtFlash > 0) {
      ctx.fillStyle = `rgba(255,80,110,${game.hurtFlash * 0.35})`;
      ctx.fillRect(0, 0, W, H);
    }
  } else {
    /* 菜单背景：草地+角色列队 */
    const menuLane = { y: 0, h: H };
    drawLaneGround(menuLane, t * 60);
    const gy = laneGround(menuLane);
    const s = clamp(Math.min(W, H) / 550, 0.6, 1.1) * 0.9;
    const n = CHARS.length;
    CHARS.forEach((ch, i) => {
      const x = W * (0.5 + (i - (n - 1) / 2) * 0.19);
      const y = gy - 24 * s + Math.abs(Math.sin(t * 3 + i)) * -14;
      drawRunnerBody(ctx, x, y, s * 0.8, t + i, ch.color, false);
      ch.draw(ctx, x, y - 26 * s, s * 0.8, t + i);
    });
  }
  ctx.restore();
}

/* ================= 菜单交互 ================= */
function buildMenu() {
  const row = $('row1');
  row.innerHTML = '';
  CHARS.forEach((ch, i) => {
    const card = document.createElement('div');
    card.className = 'char-card';
    const mini = document.createElement('canvas');
    mini.width = 128; mini.height = 128;
    card.appendChild(mini);
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = ch.name;
    card.appendChild(nm);
    const mc = mini.getContext('2d');
    mc.setTransform(2, 0, 0, 2, 0, 0);
    ch.draw(mc, 32, 38, 0.9, 1.2);
    card.addEventListener('click', () => { initAudio(); sfx.click(); selChar[0] = i; refreshSel(); });
    row.appendChild(card);
  });
  refreshSel();
}
function refreshSel() {
  [...$('row1').children].forEach((c, i) => c.classList.toggle('sel1', i === selChar[0]));
}
$('btnStart').addEventListener('click', startGame);
$('btnRetry').addEventListener('click', startGame);
$('btnHome').addEventListener('click', () => { sfx.click(); backHome(); });
$('btnQuit').addEventListener('click', () => { sfx.click(); backHome(); });
$('btnPause').addEventListener('click', () => { sfx.click(); togglePause(); });
$('btnResume').addEventListener('click', () => { sfx.click(); togglePause(); });
$('btnMute').addEventListener('click', () => { initAudio(); toggleMute(); });
$('btnLobby').addEventListener('click', () => { location.href = '../'; });
$('btnLobby2').addEventListener('click', () => { location.href = '../'; });
$('btnLobby3').addEventListener('click', () => { location.href = '../'; });

buildMenu();
requestAnimationFrame(loop);
</script>
