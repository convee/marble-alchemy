<style>

  .rps-arena { display:flex; align-items:center; justify-content:center; gap:14px; margin:10px 0 4px; }

  .rps-pick { width:76px; height:76px; border-radius:20px; border:3px solid #d6e8fb; background:#fff;

  /* ====== 小红花墙 ====== */
  .stk-title { font-weight:900; color:#c0392b; font-size:clamp(15px,4.4vw,18px); margin:16px 0 4px; }
  .stk-wall { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; width:min(520px,94vw); margin:2px auto 4px; }
  .stk { width:84px; padding:8px 4px; border-radius:14px; background:#fff; border:2px solid #f0dcc0;

  .stk.on:after { content:'🌸'; position:absolute; top:-6px; right:-4px; font-size:16px; }

  /* toast */
  #toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%) translateY(20px); opacity:0;

</style>

<script>
"use strict";

/* ========== 全局错误红条（方便手机远程排查） ========== */
window.onerror = function(m, s, l){
  var e = document.getElementById('errbar');
  e.style.display = 'block';
  e.textContent = '出错: ' + m + ' @' + l;
  return false;
};

/* ========== 小工具 ========== */
function $(id){ return document.getElementById(id); }
function show(id){ $(id).classList.remove('hidden'); }
function hide(id){ $(id).classList.add('hidden'); }
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
function speak(text){
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN'; u.rate = 0.95; u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch(e){}
}
function confetti(){
  var ems = ['🎉','⭐','🎊','✨','🌟','🍬'];
  for (var i=0;i<26;i++){
    (function(i){
      var d = document.createElement('div');
      d.className = 'confetti';
      d.textContent = ems[i % ems.length];
      d.style.left = (Math.random()*100) + 'vw';
      d.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
      d.style.animationDelay = (Math.random()*0.5) + 's';
      document.body.appendChild(d);
      setTimeout(function(){ d.remove(); }, 3600);
    })(i);
  }
}

        + '<path d="M40 68 q10 9 20 0" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"/>'
        + '<circle cx="33" cy="63" r="4" fill="#ffb3b3"/><circle cx="67" cy="63" r="4" fill="#ffb3b3"/>',
    // 铁头：方脑袋、平头、憨
    tie:  '<rect x="20" y="24" width="60" height="58" rx="14" fill="#d9c1a3" stroke="#a9865a" stroke-width="3"/>'
        + '<rect x="20" y="24" width="60" height="12" rx="6" fill="#4a3a28"/>'
        + '<rect x="34" y="50" width="9" height="6" rx="2" fill="#3a2e22"/><rect x="57" y="50" width="9" height="6" rx="2" fill="#3a2e22"/>'
        + '<path d="M40 68 q10 6 20 0" stroke="#7a5230" stroke-width="3" fill="none" stroke-linecap="round"/>'

/* ========== 存档 ========== */
var SAVE_KEY = 'mxq_school_v1';
var SAVE_VER = 2; /* 场景数量/结构变化时 +1，旧存档自动重开，避免关卡错位 */
function loadSave(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch(e){ return {}; }
}
function persist(){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch(e){}
}

/* ========== 游戏状态 ========== */
/* result: 各场景表现，写日记/小红花墙时读取（wake/recess/lunch/home 为布尔，art 存颜色名） */
var G = { ver:SAVE_VER, idx:0, stars:0, done:[], result:{} };

function resetGame(){
  G = { ver:SAVE_VER, idx:0, stars:0, done:[], result:{} };
  persist();
}
function recordResult(key, val){ G.result[key] = val; persist(); }

/* 从池子里随机抽 n 道不重复的题 */
function pickN(pool, n){
  var arr = pool.slice();
  for (var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr.slice(0, n);
}

/* ========== 顶部行程 & 星数 ========== */
function renderTrip(){
  var html = '';
  for (var i=0;i<SCENES.length;i++){
    var cls = 'dot';
    if (i < G.idx) cls += ' pass';
    else if (i === G.idx) cls += ' on';
    html += '<div class="' + cls + '"><div class="em">' + SCENES[i].icon + '</div></div>';
    if (i < SCENES.length-1) html += '<div class="arw">›</div>';
  }
  $('trip').innerHTML = html;
  $('starPill').textContent = '⭐ ' + G.stars;
}

/* ========== 场景分发 ========== */
var advancing = false; /* 防止双击「下一站」时连跳两关 */
function goStage(){
  advancing = false;
  cleanupTimers();
  hide('cover'); hide('finale'); show('stage');
  if (G.idx >= SCENES.length){ finish(); return; }
  var sc = SCENES[G.idx];
  window.KidsAI && window.KidsAI.setContext({
    scene: G.idx + 1, scene_name: sc.name, stars: G.stars,
    completed: G.done.length
  });
  $('sceneName').textContent = sc.icon + ' ' + sc.name;
  renderTrip();
  var body = $('stageBody'); body.innerHTML = '';
  if (sc.type === 'tap')    buildWake(body);
  if (sc.type === 'quiz')   buildQuiz(body, pickN(sc.key === 'road' ? ROAD_POOL : CLASS_POOL, 2), sc.key);
  if (sc.type === 'rps')    buildRps(body);
  if (sc.type === 'defend') buildDefend(body);
  if (sc.type === 'paint')  buildPaint(body);
  if (sc.type === 'choice') buildChoice(body);
}

/* 过关：加星、存档、进入下一关 */
function clearScene(gotStar){
  if (gotStar && G.done.indexOf(G.idx) < 0){ G.stars += 1; G.done.push(G.idx); }
  persist();
  renderTrip();
  window.KidsAI && window.KidsAI.event('progress', {
    scene: G.idx + 1, stars: G.stars, success: !!gotStar
  });
}
function nextScene(){
  if (advancing) return;
  advancing = true;
  G.idx += 1; persist();
  goStage();
}

/* 通用「继续」按钮 + 提示卡 */
function tipAndNext(body, tipText, gotStar){
  var tip = document.createElement('div');
  tip.className = 'tip-card show'; tip.innerHTML = tipText;
  body.appendChild(tip);
  var btn = document.createElement('button');
  btn.className = 'next-btn show';
  btn.textContent = (G.idx >= SCENES.length-1) ? '写今天的日记 📔' : '下一站 ▶';
  var used = false;
  btn.onclick = function(){ if (used) return; used = true; clearScene(gotStar); nextScene(); };
  body.appendChild(btn);
  btn.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ========== 关卡1：起床反应 ========== */
function buildWake(body){
  body.appendChild(talkRow('mom','妈妈','米小圈快起床！还有 12 秒就要迟到啦！按顺序把 5 件事做完！'));
  var wrap = document.createElement('div'); wrap.id = 'tapArea';
  var tasks = [
    { e:'😪', n:'起床' }, { e:'🪥', n:'刷牙' }, { e:'👕', n:'穿衣' },
    { e:'🍞', n:'吃早饭' }, { e:'🎒', n:'背书包' }
  ];
  var grid = document.createElement('div'); grid.className = 'task-grid';
  var cells = [];
  for (var i=0;i<tasks.length;i++){
    (function(i){
      var c = document.createElement('div'); c.className = 'task';
      c.innerHTML = '<div class="te">' + tasks[i].e + '</div><div class="tn">' + tasks[i].n + '</div>';
      c.onclick = function(){ onTap(i); };
      grid.appendChild(c); cells.push(c);
    })(i);
  }
  var bar = document.createElement('div'); bar.className = 'timebar';
  var fill = document.createElement('div'); bar.appendChild(fill);
  var hint = document.createElement('div'); hint.className = 'hint-line';
  hint.textContent = '👉 先点会发光的「起床」！';
  wrap.appendChild(grid); wrap.appendChild(bar); wrap.appendChild(hint);
  body.appendChild(wrap);

  var cur = 0, total = 12000, left = total, timer = null, ended = false;
  cells[0].classList.add('next');

  function stop(){ if (timer){ clearInterval(timer); timer = null; } }
  function onTap(i){
    if (ended) return;
    if (i !== cur){ // 点错顺序：抖一下，不惩罚
      cells[i].classList.add('shake');
      setTimeout(function(){ cells[i].classList.remove('shake'); }, 400);
      return;
    }
    cells[i].classList.remove('next'); cells[i].classList.add('done');
    cur += 1;
    if (cur < cells.length){
      cells[cur].classList.add('next');
      hint.textContent = '👉 快点「' + tasks[cur].n + '」！';
    } else {
      ended = true; stop();
      hint.textContent = '🎉 全部搞定，冲出家门！';
      speak('太棒了，准备上学咯');
      recordResult('wake', true);
      tipAndNext(body, '米小圈一阵风冲出门：「今天居然没迟到，我简直是天才！」', true);
    }
  }
  timer = setInterval(function(){
    left -= 100; var pct = Math.max(0, left/total*100);
    fill.style.width = pct + '%';
    if (left <= 0 && !ended){
      ended = true; stop();
      hint.textContent = '⏰ 有点慢啦，不过没关系～';
      recordResult('wake', false);
      tipAndNext(body, '米小圈踩着铃声冲进教室，魏老师瞪了他一眼。下次要快一点哦！', false);
    }
  }, 100);
  // 离开场景时清理计时器
  wake_cleanup = stop;
}

/* ========== 关卡2 & 3：答题（选择题 / 急转弯） ========== */
function buildQuiz(body, list, key){
  var state = { qi:0, correctCount:0 };
  function renderQ(){
    body.innerHTML = '';
    var q = list[state.qi];
    body.appendChild(talkRow(q.who, q.name, q.q));
    var card = document.createElement('div'); card.className = 'card';
    var qt = document.createElement('div'); qt.className = 'q-text';
    qt.textContent = '第 ' + (state.qi+1) + '/' + list.length + ' 题';
    card.appendChild(qt);
    var opts = document.createElement('div'); opts.className = 'opts';
    var answered = false;
    for (var i=0;i<q.opts.length;i++){
      (function(i){
        var o = document.createElement('div'); o.className = 'opt';
        o.textContent = String.fromCharCode(65+i) + '. ' + q.opts[i];
        o.onclick = function(){
          if (answered) return;
          if (i === q.right){
            answered = true;
            o.classList.add('right'); state.correctCount += 1;
            speak('答对啦');
            if (state.qi >= list.length-1){
              recordResult(key, true);
              afterQuiz(body, q.tip, function(){ clearScene(true); nextScene(); },
                (G.idx >= SCENES.length-1) ? '写今天的日记 📔' : '下一站 ▶');
            } else {
              afterQuiz(body, q.tip, function(){ state.qi += 1; renderQ(); }, '下一题 ▶');
            }
          } else {
            o.classList.add('wrong'); o.classList.add('shake');
            setTimeout(function(){ o.classList.remove('shake'); }, 400);
            toast('再想想看～ 💭');
          }
        };
        opts.appendChild(o);
      })(i);
    }
    card.appendChild(opts);
    body.appendChild(card);
  }
  renderQ();
}
// 答对后展示提示卡 + 按钮（题内流转，不切场景）
function afterQuiz(body, tipText, onClick, label){
  var card = body.querySelector('.card');
  var tip = document.createElement('div'); tip.className = 'tip-card show'; tip.innerHTML = tipText;
  card.appendChild(tip);
  var btn = document.createElement('button'); btn.className = 'next-btn show'; btn.textContent = label;
  var used = false;
  btn.onclick = function(){ if (used) return; used = true; onClick(); };
  card.appendChild(btn);
  btn.scrollIntoView({ behavior:'smooth', block:'center' });
}

/* ========== 关卡（新增）：课间十分钟——和铁头猜拳 三局两胜 ========== */
function buildRps(body){
  body.appendChild(talkRow('tie','铁头','课间十分钟到！米小圈，咱俩来猜拳，三局两胜，输的人给对方讲个笑话！'));
  var card = document.createElement('div'); card.className = 'card'; card.style.textAlign = 'center';
  var score = document.createElement('div'); score.className = 'q-text';
  card.appendChild(score);

  var arena = document.createElement('div'); arena.className = 'rps-arena';
  arena.innerHTML = '<div style="font-size:12px;font-weight:800;color:#5a86b0;">你<br><span class="rps-hand" id="youHand">✊</span></div>'
                  + '<div class="rps-vs">VS</div>'
                  + '<div style="font-size:12px;font-weight:800;color:#5a86b0;">铁头<br><span class="rps-hand" id="meHand">✊</span></div>';
  card.appendChild(arena);

  var hint = document.createElement('div'); hint.className = 'hint-line';
  hint.textContent = '👇 出什么全靠你！先到 2 分就赢～';
  card.appendChild(hint);

  var moves = [['石头','✊'],['剪刀','✌️'],['布','✋']];
  var row = document.createElement('div'); row.className = 'rps-row';
  var picks = [];
  for (var i=0;i<moves.length;i++){
    (function(i){
      var b = document.createElement('div'); b.className = 'rps-pick';
      b.innerHTML = moves[i][1] + '<span class="pl">' + moves[i][0] + '</span>';
      b.onclick = function(){ play(i); };
      row.appendChild(b); picks.push(b);
    })(i);
  }
  card.appendChild(row);
  body.appendChild(card);

  var you = 0, me = 0, ended = false;
  function setScore(){
    score.innerHTML = '你 <b style="color:#3d7fd0">' + you + '</b> ： <b style="color:#c0392b">' + me + '</b> 铁头（三局两胜）';
  }
  function reveal(el, txt){
    el.textContent = txt;
    el.classList.remove('reveal'); void el.offsetWidth; el.classList.add('reveal');
  }
  function play(pi){
    if (ended) return;
    var ci = Math.floor(Math.random()*3);
    reveal($('youHand'), moves[pi][1]);
    reveal($('meHand'),  moves[ci][1]);
    if (pi === ci){
      hint.textContent = '✊ 平局！再来一次～';
    } else if ((pi+1)%3 === ci){ // 石头>剪刀>布>石头
      you += 1; setScore(); hint.textContent = '🎉 这局你赢啦！';
    } else {
      me += 1; setScore(); hint.textContent = '😆 这局铁头赢咯～';
    }
    if (you >= 2){
      ended = true;
      for (var k=0;k<picks.length;k++) picks[k].onclick = null;
      speak('我赢啦');
      recordResult('recess', true);
      tipAndNext(body, '米小圈得意地拍拍胸脯：「铁头你就是猜不过我，哈哈！」铁头只好乖乖讲了个笑话。', true);
    } else if (me >= 2){
      ended = true;
      for (var j=0;j<picks.length;j++) picks[j].onclick = null;
      recordResult('recess', false);
      tipAndNext(body, '铁头乐得直拍手：「哈哈我赢啦！」米小圈只好绞尽脑汁给他讲了个笑话，逗得全班都笑了。', false);
    }
  }
  setScore();
}

/* ========== 关卡4：午餐护食 ========== */
function buildDefend(body){
  body.appendChild(talkRow('jia','姜小牙','嘿嘿，米小圈你的鸡腿看起来好香啊……让我尝一口嘛！'));
  var wrap = document.createElement('div'); wrap.id = 'defendArea';
  var stat = document.createElement('div'); stat.className = 'def-stat';
  stat.innerHTML = '<span class="ok">🛡 挡住 0 / 8</span><span class="bad">🍗 被偷 0 / 3</span>';
  var plate = document.createElement('div'); plate.className = 'plate';
  plate.innerHTML = '<div class="drum">🍗</div>';
  var hintline = document.createElement('div'); hintline.className = 'hint-line';
  hintline.textContent = '👋 姜小牙的手一伸出来就拍掉它！挡住 8 次就赢～';
  wrap.appendChild(stat); wrap.appendChild(plate); wrap.appendChild(hintline);
  body.appendChild(wrap);

  var blocked = 0, stolen = 0, ended = false, spawnT = null, curHand = null, reachT = null;
  var NEED = 8, MAXLOSE = 3;

  function updateStat(){
    stat.innerHTML = '<span class="ok">🛡 挡住 ' + blocked + ' / ' + NEED + '</span>'
                   + '<span class="bad">🍗 被偷 ' + stolen + ' / ' + MAXLOSE + '</span>';
  }
  function clearHand(){
    if (reachT){ clearTimeout(reachT); reachT = null; }
    if (curHand && curHand.parentNode){ curHand.parentNode.removeChild(curHand); }
    curHand = null;
  }
  function stop(){ if (spawnT){ clearTimeout(spawnT); spawnT = null; } clearHand(); }
  function popText(x, y, txt, color){
    var p = document.createElement('div'); p.className = 'pow'; p.textContent = txt;
    if (color) p.style.color = color;
    p.style.left = x + 'px'; p.style.top = y + 'px';
    plate.appendChild(p); setTimeout(function(){ if (p.parentNode) p.remove(); }, 500);
  }
  function spawn(){
    if (ended) return;
    var fromLeft = Math.random() < 0.5;
    var h = document.createElement('div'); h.className = 'hand';
    h.textContent = fromLeft ? '🤚' : '🖐';
    var pr = plate.getBoundingClientRect();
    var topY = 40 + Math.random() * (pr.height - 100);
    h.style.top = topY + 'px';
    h.style.left = fromLeft ? '-46px' : (pr.width - 6) + 'px';
    h.style.transition = 'left .9s linear';
    plate.appendChild(h); curHand = h;
    // 触发伸入动画
    var targetX = fromLeft ? (pr.width/2 - 60) : (pr.width/2 + 10);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ h.style.left = targetX + 'px'; });
    });
    var caught = false;
    h.onclick = function(){
      if (caught || ended) return;
      caught = true;
      h.classList.add('hit');
      blocked += 1; updateStat();
      popText(targetX, topY, 'PIA!', '#5cb85c');
      clearHand();
      if (blocked >= NEED){ win(); return; }
      spawnT = setTimeout(spawn, 350 + Math.random()*450);
    };
    // 到达鸡腿：偷成功
    reachT = setTimeout(function(){
      if (caught || ended) return;
      stolen += 1; updateStat();
      popText(pr.width/2 - 20, pr.height/2, '啊呜!', '#c0392b');
      clearHand();
      if (stolen >= MAXLOSE){ lose(); return; }
      spawnT = setTimeout(spawn, 400 + Math.random()*400);
    }, 1050);
  }
  function win(){
    if (ended) return; ended = true; stop();
    hintline.textContent = '🎉 守住啦！鸡腿一口都没被偷！';
    speak('鸡腿保住了');
    recordResult('lunch', true);
    tipAndNext(body, '米小圈把鸡腿护得死死的，姜小牙只好啃自己的馒头，馋得直流口水。', true);
  }
  function lose(){
    if (ended) return; ended = true; stop();
    hintline.textContent = '😅 被姜小牙偷走几口，不过还是吃饱啦～';
    recordResult('lunch', false);
    tipAndNext(body, '姜小牙嘿嘿一笑：「谢啦米小圈，你的鸡腿真香！」米小圈：「喂——那是我的！」', false);
  }
  updateStat();
  spawnT = setTimeout(spawn, 600);
  defend_cleanup = stop;
}
var defend_cleanup = null;

/* ========== 关卡5：美术课涂色 ========== */
function buildPaint(body){
  body.appendChild(talkRow('mo','莫老师','这节美术课，我们画「送给好朋友的气球」🎈。米小圈，你想涂什么颜色呀？'));
  var card = document.createElement('div'); card.className = 'card'; card.style.textAlign = 'center';
  var q = document.createElement('div'); q.className = 'q-text';
  q.textContent = '给气球选一个你最喜欢的颜色，涂给李黎吧～';
  card.appendChild(q);
  // 气球 SVG
  var svgWrap = document.createElement('div');
  svgWrap.innerHTML =
    '<svg id="paintSvg" viewBox="0 0 200 240" xmlns="http://www.w3.org/2000/svg">'
    + '<ellipse id="balloon" cx="100" cy="90" rx="62" ry="74" fill="#e8eef4" stroke="#b9c6d4" stroke-width="3"/>'
    + '<path d="M100 164 l-8 12 h16 z" fill="#b9c6d4"/>'
    + '<path d="M100 176 q10 26 -4 54" stroke="#b9a" stroke-width="2.5" fill="none"/>'
    + '<ellipse cx="80" cy="66" rx="16" ry="20" fill="rgba(255,255,255,.5)"/>'
    + '</svg>';
  card.appendChild(svgWrap);
  var row = document.createElement('div'); row.className = 'color-row';
  var colors = ['#ff8fb0','#ffcf4d','#7ec8ff','#8fe08f','#c79bff','#ff9e6b'];
  var names  = ['粉红色','金黄色','天蓝色','草绿色','紫色','橙色'];
  var picked = null, pickedName = null;
  for (var i=0;i<colors.length;i++){
    (function(i){
      var s = document.createElement('div'); s.className = 'swatch';
      s.style.background = colors[i];
      s.onclick = function(){
        picked = colors[i]; pickedName = names[i];
        var sels = row.querySelectorAll('.swatch');
        for (var k=0;k<sels.length;k++) sels[k].classList.remove('sel');
        s.classList.add('sel');
        document.getElementById('balloon').setAttribute('fill', colors[i]);
      };
      row.appendChild(s);
    })(i);
  }
  card.appendChild(row);
  var done = document.createElement('button'); done.className = 'next-btn show';
  done.textContent = '画好啦，送给李黎 🎈';
  done.onclick = function(){
    if (!picked){ toast('先选一个颜色涂上去呀～ 🎨'); return; }
    speak('画得真好看');
    recordResult('art', pickedName);
    var tip = document.createElement('div'); tip.className = 'tip-card show';
    tip.innerHTML = '莫老师笑着说：「米小圈画得真用心！」李黎收到' + pickedName + '的气球，开心地笑了。🎨✨';
    card.appendChild(tip);
    done.remove();
    var btn = document.createElement('button'); btn.className = 'next-btn show'; btn.textContent = '下一站 ▶';
    btn.onclick = function(){ clearScene(true); nextScene(); };
    card.appendChild(btn);
    btn.scrollIntoView({ behavior:'smooth', block:'center' });
  };
  card.appendChild(done);
  body.appendChild(card);
}

/* ========== 关卡6：放学剧情选择 ========== */
function buildChoice(body){
  var step = HOME_STEP;
  body.appendChild(talkRow(step.who, step.name, step.q));
  var card = document.createElement('div'); card.className = 'card';
  var opts = document.createElement('div'); opts.className = 'opts';
  var chosen = false;
  for (var i=0;i<step.opts.length;i++){
    (function(i){
      var op = step.opts[i];
      var o = document.createElement('div'); o.className = 'opt';
      o.textContent = String.fromCharCode(65+i) + '. ' + op.t;
      o.onclick = function(){
        if (chosen) return; chosen = true;
        o.classList.add(op.good ? 'right' : 'wrong');
        speak(op.good ? '真温暖' : '哎呀');
        recordResult('home', op.good);
        tipAndNext(body, op.tip, op.good);
      };
      opts.appendChild(o);
    })(i);
  }
  card.appendChild(opts);
  body.appendChild(card);
}

/* ========== 结算：写日记 ========== */
function finish(){
  cleanupTimers();
  hide('stage'); hide('cover'); show('finale');
  var s = G.stars, total = SCENES.length;
  window.KidsAI && window.KidsAI.event('round_complete', {
    stars: s, scenes: total, completed: G.done.length
  });
  var starStr = '';
  for (var i=0;i<total;i++) starStr += (i < s ? '⭐' : '☆');
  $('finStars').textContent = starStr;

  var r = G.result || {};
  var wakeOk = r.wake === true;
  var recessOk = r.recess === true;
  var lunchOk = r.lunch === true;
  var homeOk = r.home === true;
  var artColor = r.art ? r.art : '漂亮的颜色';

  var mood, comment;
  if (s >= total){ mood = '真是超级棒的一天！'; comment = '米小圈觉得自己简直是全班最厉害的小朋友，明天还要更棒！'; }
  else if (s >= total-1){ mood = '今天过得特别开心～'; comment = '就差那么一点点就满分啦，米小圈已经很得意了。'; }
  else if (s >= Math.ceil(total/2)){ mood = '今天过得挺开心的～'; comment = '虽然有几件事有点手忙脚乱，但米小圈玩得很尽兴。'; }
  else { mood = '今天有点小手忙脚乱，'; comment = '不过没关系，米小圈说明天一定会做得更好！'; }

  var now = new Date();
  var diary =
    '<h3>2026年 ' + (now.getMonth()+1) + '月 星期一　🌤 晴</h3>'
  + '<p>今天早上我又<b>赖床</b>了，' + (wakeOk ? '不过我像一阵风冲出了门，一点都没迟到！' : '踩着上课铃才冲进教室，被<b>魏老师</b>瞪了一眼。') + '</p>'
  + '<p>上学路上碰到<b>铁头</b>和<b>姜小牙</b>，他们又出脑筋急转弯考我，被我一个个破解啦～</p>'
  + '<p>课堂上<b>魏老师</b>点名提问我，还好我全答上来了（吓死我了）。</p>'
  + '<p>课间十分钟和铁头猜拳三局两胜，' + (recessOk ? '我赢了，他还得给我讲笑话，哈哈！' : '可惜我输了，只好给他讲了个笑话逗大家开心。') + '</p>'
  + '<p>午餐时姜小牙一直想偷我的<b>鸡腿</b>，' + (lunchOk ? '全被我拍开了，一口都没让他偷到！' : '被他偷吃了好几口……哼，下次一定看紧点！') + '</p>'
  + '<p>美术课上<b>莫老师</b>让我画气球送给<b>李黎</b>，我涂了<b>' + artColor + '</b>，她可开心了。放学下大雨，' + (homeOk ? '我和李黎一起打伞回的家，一路上笑个不停。' : '我逞强淋了雨，回家打了好几个喷嚏。') + '</p>'
  + '<p>' + mood + comment + '</p>'
  + '<div class="sign">—— 米小圈　得到 ' + s + ' 颗⭐</div>';
  $('diary').innerHTML = diary;

  renderStickers(wakeOk, recessOk, lunchOk, homeOk, !!r.art);
  confetti();
  speak('今天的日记写好啦，你陪米小圈得到了 ' + s + ' 颗星星');
}

/* 小红花墙：把今天的表现变成一面收集墙 */
function renderStickers(wakeOk, recessOk, lunchOk, homeOk, artOk){
  var stk = [
    { on:wakeOk,   e:'🌅', t:'准时起床' },
    { on:true,     e:'🧠', t:'急转弯王' },
    { on:true,     e:'📖', t:'课堂之星' },
    { on:recessOk, e:'✊', t:'猜拳高手' },
    { on:lunchOk,  e:'🍗', t:'鸡腿卫士' },
    { on:artOk,    e:'🎨', t:'小画家' },
    { on:homeOk,   e:'☔', t:'暖心朋友' }
  ];
  var got = 0, html = '';
  for (var i=0;i<stk.length;i++){
    if (stk[i].on) got += 1;
    html += '<div class="stk ' + (stk[i].on ? 'on' : 'off') + '">'
          + '<div class="se">' + stk[i].e + '</div><div class="st">' + stk[i].t + '</div></div>';
  }
  $('stkTitle').textContent = '🌸 今天收集了 ' + got + ' / ' + stk.length + ' 朵小红花';
  $('stkWall').innerHTML = html;
}

/* ========== 计时器清理 ========== */
function cleanupTimers(){
  if (wake_cleanup){ wake_cleanup(); wake_cleanup = null; }
  if (defend_cleanup){ defend_cleanup(); defend_cleanup = null; }
}

/* ========== 事件绑定 ========== */
function initCast(){
  var list = [['mxq','米小圈'],['tie','铁头'],['jia','姜小牙'],['lili','李黎'],['wei','魏老师'],['mo','莫老师']];
  var html = '';
  for (var i=0;i<list.length;i++){
    html += '<div class="who">' + avatar(list[i][0]) + '<span>' + list[i][1] + '</span></div>';
  }
  $('cast').innerHTML = html;
}

$('startBtn').onclick = function(){
  var sv = loadSave();
  if (sv && sv.ver === SAVE_VER && typeof sv.idx === 'number' && sv.idx > 0 && sv.idx < SCENES.length){
    G = { ver:SAVE_VER, idx: sv.idx, stars: sv.stars || 0, done: sv.done || [], result: sv.result || {} };
  } else {
    resetGame();
  }
  window.KidsAI && window.KidsAI.event('round_start', {
    scene: G.idx + 1, stars: G.stars, completed: G.done.length
  });
  goStage();
};
$('homeBtn').onclick = function(){
  cleanupTimers();
  if (window.confirm('要回到「小小游戏乐园」吗？进度会保存哦～')) location.href = '../';
  else { /* 留在原地，重建当前场景以恢复计时器 */ goStage(); }
};
$('finHome').onclick = function(){ location.href = '../'; };
$('coverHome').onclick = function(){ location.href = '../'; };
$('againBtn').onclick = function(){
  resetGame();
  window.KidsAI && window.KidsAI.event('round_start', { scene: 1, stars: 0, completed: 0 });
  goStage();
};

initCast();
